[project]
name = "spirob-control"
version = "1.0.0"
description = "Grafische Bedienoberfläche für den Seilzug-Tentakel SpiRob (Handbetrieb, trainierte Policy, digitaler Zwilling)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mujoco>=3.2",
  "numpy>=1.26",
  "pyserial>=3.5",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
spirob-control = "spirob_control.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spirob_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
